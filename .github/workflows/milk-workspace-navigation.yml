name: Milk Workspace Navigation Checks
on:
  pull_request:
  push:
    branches:
      - fix/login-js-syntax-2026-10-16
jobs:
  milk-workspace-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Milk Center navigation and visibility
        run: node tests/milk-workspace-navigation.test.cjs
      - name: Check inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          let cursor = 0;
          let index = 0;
          while ((cursor = html.indexOf('<script', cursor)) !== -1) {
            const openEnd = html.indexOf('>', cursor);
            const close = html.indexOf('</script>', openEnd + 1);
            if (openEnd < 0 || close < 0) throw new Error('Malformed script tag');
            const source = html.slice(openEnd + 1, close).trim();
            if (source) {
              new Function(source);
              process.stdout.write('PASS inline script ' + (index + 1) + '\n');
            }
            index += 1;
            cursor = close + 9;
          }
          NODE
