<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<title>মুহাইমিন — Dairy Management</title>
<style>
:root{--green:#0f766e;--dark:#115e59;--bg:#f3f7f6;--line:#dbe5e3;--text:#17202a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:var(--green);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px #0002}
.brandLogo{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff}h1{font-size:19px;margin:0 0 3px}.sub{font-size:11px;opacity:.95}.small{font-size:12px;color:#64748b}
.headerTools{margin-left:auto;display:flex;gap:6px;align-items:center}.headerTools select{width:auto;max-width:125px;padding:8px}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px;background:#fff;position:sticky;top:68px;z-index:9;border-bottom:1px solid var(--line)}
nav button,.btn{border:0;border-radius:10px;padding:10px;background:#e3f2ef;color:#0f5f59;font-weight:700;cursor:pointer;font-size:13px}
nav button.active{background:var(--green);color:#fff}.nav-icon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px;width:28px;height:28px;border-radius:8px;background:#ffffffb8;font-size:18px;line-height:1}nav button{display:flex;align-items:center;justify-content:flex-start;gap:7px;min-height:46px;text-align:left;line-height:1.25;white-space:normal}nav button.active .nav-icon{background:#ffffff25}.btn.primary{background:var(--green);color:white}.danger{background:#fee2e2!important;color:#991b1b!important}
button:disabled{opacity:.55;cursor:not-allowed}main{padding:12px;max-width:1150px;margin:auto}.page{display:none}.page.active{display:block}
.card{background:#fff;border:1px solid #edf1f0;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #00000008}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:14px;border-radius:12px;background:#effaf7}.stat b{font-size:21px;display:block;margin-top:5px}
label{display:block;font-weight:700;font-size:13px;margin:9px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;background:#fff;color:var(--text)}
textarea{min-height:65px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left;vertical-align:top}th{background:#f8fafc}.tablewrap{overflow:auto}
.hidden{display:none!important}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17202a;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:50;max-width:92%}
#login{max-width:460px;margin:22px auto}.pw-wrap{display:flex;gap:6px}.pw-wrap input{flex:1;min-width:0}.pw-wrap button{border:1px solid #cbd5e1;border-radius:9px;background:#f8fafc;padding:0 12px}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e6f3f1;font-size:11px}.section-title{display:flex;align-items:center;gap:8px}.section-title .ico{font-size:20px}
a.callBtn{display:inline-block;text-decoration:none;padding:7px 10px;white-space:nowrap}
@media(min-width:760px){nav{grid-template-columns:repeat(6,minmax(0,1fr));top:68px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}header{padding-left:max(14px,calc((100vw - 1150px)/2))}}
</style>
</head>
<body>
<header>
<img class="brandLogo" src="muhaimin-logo.png" alt="Muhaimin Dairy Logo" onerror="this.style.display='none'">
<div><h1 id="appName">মুহাইমিন</h1><div class="sub" id="headerSub">ডেইরি ও প্রাণিজ পণ্য ব্যবস্থাপনা • Supabase Online</div><div class="sub">📱 Mobile Ready • Farmer Call</div></div>
<div class="headerTools"><label for="language" class="hidden">Language</label><select id="language" aria-label="Language"><option value="bn">🇧🇩 বাংলা</option><option value="en">🇬🇧 English</option></select></div>
</header>

<section id="login" class="card">
<h3 data-i18n="loginTitle">🔐 লগইন</h3>
<p class="small" data-i18n="authInfo">আপনার Supabase Auth অ্যাকাউন্টের ইমেইল ও পাসওয়ার্ড ব্যবহার করুন।</p>
<label data-i18n="emailLabel">ইমেইল<input id="loginEmail" type="email" autocomplete="email" required></label>
<label data-i18n="passwordLabel">পাসওয়ার্ড</label>
<div class="pw-wrap"><input id="loginPassword" type="password" autocomplete="current-password"><button type="button" id="togglePassword" aria-label="Show password">👁</button></div>
<div class="row" style="margin-top:10px"><button class="btn primary" id="loginBtn">🔑 লগইন</button><button class="btn" id="signupBtn">📝 রেজিস্ট্রেশন</button></div>
<div class="row" style="margin-top:6px"><button class="btn" id="resetBtn">🔁 পা
